[project]
name = "twilio-agent-connect-google"
version = "1.0.0"
description = "Google Cloud integrations for Twilio Agent Connect (TAC) - connectors for Google Cloud agent runtimes"
readme = "README.md"
requires-python = ">=3.10,<3.12"
license = { text = "MIT" }
authors = [
    { name = "Twilio", email = "help@twilio.com" }
]
keywords = ["twilio", "agent", "google-cloud", "vertex-ai", "conversational-ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]

dependencies = [
    # Core TAC from PyPI
    "twilio-agent-connect>=2.3.0,<3",
]

[project.optional-dependencies]
# FastAPI-based TAC Server (uses TAC core's server extras)
server = [
    "twilio-agent-connect[server]>=2.3.0,<3",
    "python-dotenv>=1.0.0",
]

# Vertex AI connector (Gemini models)
vertex-ai = [
    "google-cloud-aiplatform[reasoningengine,agent-engines]>=1.148.1,<2",
    "google-genai>=2.9,<3",
    "google-auth>=2,<3",
]

# CX Agent Studio connector. No Vertex AI SDK needed; `websockets` is for
# VoiceS2SChannel's BidiRunSession client.
cx-agent-studio = [
    "google-auth>=2,<3",
    "requests>=2,<3",
    "websockets>=14,<16",
]

# Conversational Agents connector (Dialogflow CX detectIntent REST API).
# Lightweight: just auth + HTTP, no Vertex AI SDK.
conversational-agents = [
    "google-auth>=2,<3",
    "requests>=2,<3",
]

# Development dependencies (includes all runtime features and Google Cloud SDKs)
dev = [
    # Google Cloud SDK dependencies
    "google-cloud-aiplatform[agent-engines]>=1.148.1,<2",
    "google-genai>=2.9,<3",
    "google-adk[a2a]>=2.2.0,<2.3",
    # Server dependencies (via TAC core)
    "twilio-agent-connect[server]>=2.3.0,<3",
    "python-dotenv>=1.0.0",
    # Dev tools
    "pytest>=7.0.0,<8",
    "pytest-asyncio>=0.23.0,<1",
    "pytest-cov>=5.0.0,<6",
    "ruff>=0.8.0,<1",
    "mypy>=1.0.0,<2",
    "types-google-cloud-ndb>=2.0.0",
]

[dependency-groups]
docs = [
    "mkdocs>=1.6.0,<2",
    "mkdocs-material>=9.5.0,<10",
    "mkdocstrings[python]>=1.0.0,<2",
    "mike>=2.1.0,<3",
]

[project.urls]
Homepage = "https://github.com/twilio/twilio-agent-connect-google"
Documentation = "https://www.twilio.com/docs/conversations/agent-connect"
Repository = "https://github.com/twilio/twilio-agent-connect-google"
Issues = "https://github.com/twilio/twilio-agent-connect-google/issues"

[build-system]
# hatchling>=1.30 defaults to Metadata-Version 2.5, which the org-allowlisted
# pypa/gh-action-pypi-publish pin (v1.14.0) can't validate yet. Cap below that
# until a newer, allowlisted publish action pin is available.
requires = ["hatchling<1.30"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tac_google"]
exclude = [
    "/.github",
    "/.venv",
    "/tests",
    "/deploy",
    "/getting_started",
]

[tool.hatch.build.targets.sdist]
exclude = [
    "/.github",
    "/.venv",
    "/tests",
    "/deploy",
    "/getting_started",
    "/.gitignore",
    "/.pre-commit-config.yaml",
    "/Makefile",
    "/CLAUDE.md",
    "/pytest.ini",
    "/uv.lock",
    "*.pyc",
    "__pycache__",
    ".DS_Store",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "N"]
ignore = ["E501"]
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.per-file-ignores]
"examples/*" = ["E402", "E501"]

[tool.ruff.lint.isort]
known-first-party = ["tac_google"]
combine-as-imports = true

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true
strict_concatenate = true

# Ignore missing imports for optional dependencies
[[tool.mypy.overrides]]
module = "google.cloud.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "vertexai.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "twilio.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers --strict-config"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "asyncio: mark test as an asyncio test",
]

[tool.coverage.run]
source = ["src/tac_google"]
omit = ["*/tests/*", "*/__pycache__/*", "*/.venv/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]
